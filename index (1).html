<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;

            transform: translateY(-5px);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
        }
        .submit-btn {
            background: #8B4513;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .submit-btn:hover {
            background: #A0522D;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }

</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="form-container max-w-lg w-full mx-4 p-8">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Case Reporting Form</h2>
        <form id="caseForm" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="department" class="block text-sm font-medium text-gray-700">Department</label>
                <select id="department" name="department" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-brown-500 focus:border-brown-500">
                    <option value="">Select Department</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="F&B">F&B</option>
                    <option value="BI">BI</option>
                </select>
            </div>
            <div>
                <label for="caseDate" class="block text-sm font-medium text-gray-700">Case Date</label>
                <input type="date" id="caseDate" name="caseDate" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-brown-500 focus:border-brown-500" max="2025-04-30">
            </div>
            <div>
                <label for="priority" class="block text-sm font-medium text-gray-700">Priority</label>
                <select id="priority" name="priority" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-brown-500 focus:border-brown-500">
                    <option value="">Select Priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>

                <button type="submit" class="submit-btn w-full text-white font-semibold py-2 px-4 rounded-md">Submit</button>
            </div>
        </form>
        <p id="status" class="mt-4 text-center text-sm text-gray-600"></p>
    </div>

    <script>
        document.getElementById('caseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const status = document.getElementById('status');
            status.textContent = 'Submitting...';
            status.className = 'mt-4 text-center text-sm text-gray-600';

            const formData = new FormData(this);
            try {
                const response = await fetch('YOUR_GOOGLE_APPS_SCRIPT_URL', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.status === 'success') {
                    status.textContent = 'Submission successful!';
                    status.className = 'mt-4 text-center text-sm text-green-600';
                    this.reset();
                } else {
                    status.textContent = 'Error: ' + result.message;
                    status.className = 'mt-4 text-center text-sm text-red-600';
                }
            } catch (error) {
                status.textContent = 'Error submitting form. Please try again.';
                status.className = 'mt-4 text-center text-sm text-red-600';
            }
        });
    </script>
</body>
</html>
