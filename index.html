<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Reporting Form</title>
    <link rel="icon" type="image/png" href="https://media-exp1.licdn.com/dms/image/C4E0BAQHCgkEymt1qLw/company-logo_200_200/0/1593124750021?e=2147483647&v=beta&t=QSoVJmJS8oaX-Nt03hsMtiyawCTlqP1alUt1GNq7DnA">
    <script src="<img src="https://media-exp1.licdn.com/dms/image/C4E0BAQHCgkEymt1qLw/company-logo_200_200/0/1593124750021?e=2147483647&v=beta&t=QSoVJmJS8oaX-Nt03hsMtiyawCTlqP1alUt1GNq7DnA"></script>
     <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .form-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
        }
        .submit-btn {
            background: #8B4513;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .submit-btn:hover {
            background: #A0522D;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-container {
            animation: fadeIn 0.5s ease-out;
        }
        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="form-container max-w-lg w-full mx-4 p-8 text-center">
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Kaldis CNET Logo" class="logo mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Case Reporting Form</h2>
        <form id="caseForm" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="department" class="block text-sm font-medium text-gray-700">Department</label>
                <select id="department" name="department" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-brown-500 focus:border-brown-500">
                    <option value="">Select Department</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="F&B">F&B</option>
                    <option value="BI">BI</option>
                </select>
            </div>
            <div>
                <label for="caseDate" class="block text-sm font-medium text-gray-700">Case Date</label>
                <input type="date" id="caseDate" name="caseDate" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-brown-500 focus:border-brown-500" max="2025-04-30">
            </div>
            <div>
                <label for="priority" class="block text-sm font-medium text-gray-700">Priority</label>
                <select id="priority" name="priority" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-brown-500 focus:border-brown-500">
                    <option value="">Select Priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" name="description" required rows="4" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-brown-500 focus:border-brown-500"></textarea>
            </div>
            <div>
                <label for="attachment" class="block text-sm font-medium text-gray-700">Attach File</label>
                <input type="file" id="attachment" name="attachment" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <button type="submit" class="submit-btn w-full text-white font-semibold py-2 px-4 rounded-md">Submit</button>
            </div>
        </form>
        <p id="status" class="mt-4 text-center text-sm text-gray-600"></p>
    </div>

    <script>
        document.getElementById('caseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const status = document.getElementById('status');
            const submitButton = this.querySelector('button[type="submit"]');
            submitButton.disabled = true; // Disable button to prevent multiple submissions
            status.textContent = 'Submitting...';
            status.className = 'mt-4 text-center text-sm text-gray-600';

            const formData = new FormData(this);
            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycby8ZdTYxQAcNE1a7K57ZGnP6U2stHq5z24meRoAXlFQJZCjkhi-zHVSdvHbZVtmLVQ6/exec', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.status === 'success') {
                    status.textContent = 'Submission successful!';
                    status.className = 'mt-4 text-center text-sm text-green-600';
                    this.reset();
                } else {
                    status.textContent = 'Error: ' + result.message;
                    status.className = 'mt-4 text-center text-sm text-red-600';
                }
            } catch (error) {
                status.textContent = 'Error submitting form. Please try again.';
                status.className = 'mt-4 text-center text-sm text-red-600';
            } finally {
                submitButton.disabled = false; // Re-enable button after request
            }
        });
    </script>
</body>
</html>
